<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="244" viewBox="0 0 1120 244" role="img" aria-labelledby="title desc">
  <title id="title">A geometric construction in space and time</title>
  <desc id="desc">A discrete spatial Stokes identity gives an open port-Hamiltonian representation. Active temporal stages with an alternating gauge are closed by the port-Hamiltonian constitutive equations. Their discrete chain rule yields the balance of stored energy, boundary work and dissipation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="244" rx="12" fill="#f7f9fc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="24" y="31" font-size="13" font-weight="600" letter-spacing="1.2" fill="#475569">SPACE–TIME STOKES–DIRAC CONSTRUCTION</text>
    <g fill="#ffffff" stroke="#dbe2ec" stroke-width="1.2">
      <rect x="24" y="51" width="244" height="167" rx="8"/>
      <rect x="302" y="51" width="244" height="167" rx="8"/>
      <rect x="580" y="51" width="244" height="167" rx="8"/>
      <rect x="858" y="51" width="238" height="167" rx="8" fill="#edf8f5" stroke="#9bcec2"/>
    </g>
    <g stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)">
      <path d="M274 135 H294"/>
      <path d="M552 135 H572"/>
      <path d="M830 135 H850"/>
    </g>
    <g font-size="11" font-weight="700" letter-spacing="1.3" fill="#0f766e">
      <text x="42" y="77">01 · SPACE</text>
      <text x="320" y="77">02 · TIME</text>
      <text x="598" y="77">03 · CONSTITUTIVE LAWS</text>
      <text x="876" y="77">04 · POWER BALANCE</text>
    </g>
    <g font-size="18" font-weight="650" fill="#172b4d">
      <text x="42" y="106">Discrete Stokes identity</text>
      <text x="320" y="106">Active temporal stages</text>
      <text x="598" y="106" font-size="17">Port-Hamiltonian closure</text>
      <text x="876" y="106">Stored energy change</text>
    </g>
    <g font-size="15" fill="#334155">
      <text x="42" y="136">Open Dirac representation</text>
      <text x="42" y="158">Boundary inputs and outputs</text>
      <text x="42" y="192" fill="#64748b">2012 spatial discretization</text>
      <text x="320" y="136">E = G − W⁻¹KₕF</text>
      <text x="320" y="158">Alternating gauge: Kₕᵀ = −Kₕ</text>
      <text x="320" y="192" fill="#64748b">Discrete chain rule retained</text>
      <text x="598" y="136">Fᵢ = (Jᵢ − Rᵢ)Eᵢ + BᵢUᵢ</text>
      <text x="598" y="158">Stage efforts remain active</text>
      <text x="598" y="192" fill="#64748b">Nonlinearity and dissipation</text>
      <text x="876" y="140" font-size="19" fill="#0f766e">= boundary work</text>
      <text x="894" y="167" font-size="19" fill="#0f766e">− dissipated energy</text>
      <text x="876" y="196" fill="#47685f">Per temporal cell</text>
    </g>
  </g>
</svg>
